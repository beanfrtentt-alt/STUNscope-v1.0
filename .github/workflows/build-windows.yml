name: build-windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: PyInstaller (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with GUI and dev extras
        run: python -m pip install -e ".[gui,dev]"

      - name: Run tests before building
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build executables with PyInstaller
        run: pwsh ./scripts/build_windows.ps1

      - name: Upload GUI executable
        uses: actions/upload-artifact@v4
        with:
          name: STUNScope-gui-windows
          path: dist/STUNScope
          if-no-files-found: error

      - name: Upload CLI executable
        uses: actions/upload-artifact@v4
        with:
          name: STUNScope-cli-windows
          path: dist/stunscope-cli
          if-no-files-found: error
